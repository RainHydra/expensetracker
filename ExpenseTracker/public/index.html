<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker &amp; Budget Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">₹</span>
      <div>
        <h1>Expense Tracker</h1>
        <p>Personal expense tracking &amp; budget management</p>
      </div>
    </div>
    <label class="month-picker">
      Month
      <input type="month" id="monthPicker">
    </label>
  </header>

  <main class="container">
    <div id="alerts"></div>

    <!-- Summary cards -->
    <section class="cards">
      <div class="card income"><span>Income</span><strong id="sumIncome">₹0.00</strong></div>
      <div class="card expense"><span>Expenses</span><strong id="sumExpense">₹0.00</strong></div>
      <div class="card balance"><span>Balance</span><strong id="sumBalance">₹0.00</strong></div>
    </section>

    <div class="grid">
      <!-- Add transaction -->
      <section class="panel">
        <h2>Add Transaction</h2>
        <form id="txForm" autocomplete="off">
          <div class="toggle">
            <input type="radio" name="type" id="typeExpense" value="EXPENSE" checked>
            <label for="typeExpense">Expense</label>
            <input type="radio" name="type" id="typeIncome" value="INCOME">
            <label for="typeIncome">Income</label>
          </div>
          <label>Category
            <select name="category" id="txCategory" required></select>
          </label>
          <label>Amount (₹)
            <input type="number" name="amount" min="0.01" step="0.01" placeholder="0.00" required>
          </label>
          <label>Date
            <input type="date" name="date" id="txDate" required>
          </label>
          <label>Description
            <input type="text" name="description" maxlength="80" placeholder="Optional note">
          </label>
          <button type="submit" class="btn primary">Add Transaction</button>
        </form>
      </section>

      <!-- Spending chart -->
      <section class="panel">
        <h2>Spending by Category</h2>
        <div class="chart-wrap">
          <canvas id="chart" width="260" height="260"></canvas>
          <ul id="legend" class="legend"></ul>
        </div>
        <p id="chartEmpty" class="empty hidden">No expenses this month.</p>
      </section>
    </div>

    <div class="grid">
      <!-- Budgets -->
      <section class="panel">
        <h2>Monthly Budgets</h2>
        <form id="budgetForm" class="inline-form" autocomplete="off">
          <select name="category" id="budgetCategory" required></select>
          <input type="number" name="limit" min="1" step="0.01" placeholder="Limit (₹)" required>
          <button type="submit" class="btn primary">Set</button>
        </form>
        <div id="budgetList"></div>
      </section>

      <!-- Transactions -->
      <section class="panel">
        <h2>Transactions</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Date</th><th>Category</th><th>Note</th><th class="num">Amount</th><th></th></tr>
            </thead>
            <tbody id="txBody"></tbody>
          </table>
        </div>
        <p id="txEmpty" class="empty hidden">No transactions for this month yet.</p>
      </section>
    </div>
  </main>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
